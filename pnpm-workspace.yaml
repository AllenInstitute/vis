packages:
    - 'packages/**'
    - 'site/**'
    - '!**test**'

# These packages ship prebuilt binaries; their install scripts were already
# skipped under pnpm 10, and pnpm 11 requires an explicit decision.
allowBuilds:
    esbuild: false
    sharp: false

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
    - '@alleninstitute/*'
