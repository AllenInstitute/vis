# Autofix-only: these commands never block a commit. Unfixable lint errors are
# printed for visibility, but `|| true` keeps the hook green. CI is what gates.
#
# `glob` scopes oxlint to the file types it handles, so a commit touching only
# e.g. Markdown skips it instead of spawning a no-op process. fmt runs on every
# staged file; --no-error-on-unmatched-pattern lets oxfmt skip types it doesn't
# handle.
pre-commit:
    commands:
        lint:
            priority: 1
            # oxlint reads .astro too, and CI's bare `oxlint` discovers them.
            glob: '*.{js,jsx,mjs,cjs,mts,cts,ts,tsx,astro}'
            run: pnpm exec oxlint --fix {staged_files} || true
            stage_fixed: true
        fmt:
            priority: 2
            run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files} || true
            stage_fixed: true
